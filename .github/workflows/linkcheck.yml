name: Linkcontrole

# Elke 1e van de maand om 06:17 UTC, en handmatig te starten via het tabblad Actions.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Links controleren
        id: check
        run: |
          set +e
          python3 scripts/linkcheck.py index.html linkcheck-rapport.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat linkcheck-rapport.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Issue aanmaken, bijwerken of sluiten
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          gh label create linkcontrole --color d93f0b --description "Dode links gevonden door de maandelijkse controle" 2>/dev/null || true
          open=$(gh issue list --label linkcontrole --state open --json number --jq '.[0].number // empty')
          maand=$(date -u +%Y-%m)
          if [ "$CODE" != "0" ]; then
            aantal=$(grep -c '^- `' linkcheck-rapport.md || true)
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file linkcheck-rapport.md
            else
              gh issue create --label linkcontrole --title "Linkcontrole $maand: dode links gevonden" --body-file linkcheck-rapport.md
            fi
            echo "Dode links gevonden"
            exit 1
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Alle links werken weer ($maand). Issue gesloten door de linkcontrole."
            gh issue close "$open" --reason completed
          fi

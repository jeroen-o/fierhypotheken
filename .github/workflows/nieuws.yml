name: Nieuws verversen

# Haalt elke ochtend rond 10.00 uur (Nederlandse tijd) het nieuws van Obvion, NN,
# Florius, NIBC en Jens op en werkt index.html bij als er iets nieuws is. Mislukt een
# bron, dan blijft het oude nieuws staan en wordt er een issue geopend.
# GitHub plant alleen in UTC: 10.00 uur is 08:00 UTC in de zomer en 09:00 UTC in de
# winter. Daarom staan er twee tijdstippen en slaat de stap "Tijdcontrole" het
# verkeerde tijdstip over. GitHub kan geplande runs enkele minuten vertragen.
# Handmatig starten kan via het tabblad Actions.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen rapporteren, niets wijzigen"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: nieuws
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tijdcontrole
        id: tijd
        env:
          EVENT: ${{ github.event_name }}
        run: |
          uur=$(TZ=Europe/Amsterdam date +%H)
          if [ "$EVENT" = "schedule" ] && [ "$uur" != "10" ]; then
            echo "Het is $uur uur in Nederland, niet 10 uur: deze run wordt overgeslagen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.tijd.outputs.run == 'true' }}

      - name: Nieuws ophalen
        id: nieuws
        if: ${{ steps.tijd.outputs.run == 'true' }}
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set +e
          if [ "$DRY" = "true" ]; then flag=""; else flag="--write"; fi
          python3 scripts/nieuws_update.py index.html nieuws-rapport.md $flag
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat nieuws-rapport.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Wijzigingen vastleggen
        id: commit
        if: ${{ steps.tijd.outputs.run == 'true' && inputs.dry_run != true }}
        run: |
          if git diff --quiet -- index.html; then
            echo "Geen nieuwe berichten."; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Nieuws verstrekkers automatisch bijgewerkt ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Site opnieuw publiceren
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages-build niet handmatig gestart; GitHub doet dit normaal zelf na de push."

      - name: Issue openen, bijwerken of sluiten
        if: ${{ steps.tijd.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.nieuws.outputs.code }}
        run: |
          gh label create nieuws-bron --color fbca04 --description "Een nieuwsbron kon niet worden uitgelezen" 2>/dev/null || true
          open=$(gh issue list --label nieuws-bron --state open --json number --jq '.[0].number // empty')
          if [ "$CODE" != "0" ]; then
            if [ -n "$open" ]; then
              echo "Er staat al een open issue (#$open); geen nieuwe melding."
            else
              gh issue create --label nieuws-bron --title "Nieuwscontrole $(date -u +%Y-%m-%d): bron niet uitgelezen" --body-file nieuws-rapport.md
              exit 1
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Alle nieuwsbronnen werken weer ($(date -u +%Y-%m-%d)). Issue gesloten door de nieuwscontrole."
            gh issue close "$open" --reason completed
          fi
